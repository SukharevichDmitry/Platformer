name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash ./gradlew :core:check --no-daemon
      - run: xvfb-run -a bash ./gradlew :lwjgl3:simulationRegressionTest --no-daemon
